server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to System A
    location /api/core/ {
        proxy_pass http://system-a:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy API calls to System B
    location /api/discovery/ {
        proxy_pass http://system-b:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}